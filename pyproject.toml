[tool.uv.workspace]
members = [
    "backend/apps/api",
    "backend/services/llm",
    "backend/services/memory",
    "backend/services/retrieval",
    "backend/services/storage",
    "backend/packages/config",
    "eval",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in default arguments
]

[tool.ruff.lint.isort]
known-first-party = ["config", "storage", "llm", "retrieval", "memory"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["backend", "eval"]

[dependency-groups]
dev = [
    "ruff>=0.15.6",
]
